[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vallox-modbus"
version = "0.2.1"
description = "Vallox MV Modbus device library"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tra1n84" }]
maintainers = [{ name = "Tra1n84" }]
keywords = [
    "asyncio",
    "home-assistant",
    "home-automation",
    "hvac",
    "modbus",
    "vallox",
    "ventilation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["modbus-connection>=4.12.1"]

[project.urls]
Homepage = "https://github.com/Tra1n84/vallox-modbus"
Source = "https://github.com/Tra1n84/vallox-modbus"
Issues = "https://github.com/Tra1n84/vallox-modbus/issues"

[project.optional-dependencies]
serial = ["modbus-connection[tmodbus]>=4.12.1"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vallox_modbus"]

[tool.hatch.build.targets.sdist]
include = [
    "/.github/workflows/tests.yml",
    "/docs",
    "/script",
    "/src",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
